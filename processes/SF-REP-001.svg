<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2960 480" width="2960" height="480" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="2960" height="480" fill="#ffffff"/>
  <text x="20" y="36" font-size="16" font-weight="700" fill="#0f172a">Detect and report suspected SF medical product (SF-REP-001)</text>
  <text x="20" y="56" font-size="11" fill="#475569">WHO DTH for SF Medical Product Reporting Systems — SF-REP-001 (OMG BPMN 2.0)</text>
  <rect x="40" y="80" width="2900" height="180" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="40" y="80" width="110" height="180" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="52" y="104" font-size="11" font-weight="600" fill="#1e293b">Healthcare professional / pa</text>
  <rect x="40" y="260" width="2900" height="180" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="40" y="260" width="110" height="180" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="52" y="284" font-size="11" font-weight="600" fill="#1e293b">NMRA &amp; SF Reporting System B</text>
  <line x1="216" y1="170" x2="350" y2="170" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="170" x2="520" y2="170" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="170" x2="860" y2="170" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="715" y="164" font-size="9" fill="#0f172a" text-anchor="middle">Registered</text>
  <line x1="570" y1="170" x2="690" y2="170" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="630" y="164" font-size="9" fill="#0f172a" text-anchor="middle">Not found (unregistered / F2)</text>
  <line x1="820" y1="170" x2="1030" y2="170" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="990" y1="170" x2="1030" y2="170" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1160" y1="170" x2="1200" y2="170" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1330" y1="170" x2="1370" y2="170" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1420" y1="170" x2="1540" y2="170" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1480" y="164" font-size="9" fill="#0f172a" text-anchor="middle">Substandard</text>
  <line x1="1420" y1="170" x2="1880" y2="170" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1650" y="164" font-size="9" fill="#0f172a" text-anchor="middle">Falsified</text>
  <line x1="1670" y1="170" x2="1710" y2="170" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="2010" y1="170" x2="2050" y2="170" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1840" y1="170" x2="2220" y2="170" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="2180" y1="170" x2="2220" y2="170" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="2270" y1="170" x2="2390" y2="170" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="2330" y="164" font-size="9" fill="#0f172a" text-anchor="middle">Contact provided</text>
  <line x1="2270" y1="170" x2="2560" y2="170" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="2415" y="164" font-size="9" fill="#0f172a" text-anchor="middle">Anonymous</text>
  <line x1="2520" y1="170" x2="2730" y2="170" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="2690" y1="170" x2="2730" y2="170" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="2860" y1="170" x2="180" y2="350" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="310" y1="350" x2="350" y2="350" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="350" x2="520" y2="350" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="650" y1="350" x2="690" y2="350" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="198" cy="170" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="198" y="202" font-size="9" fill="#1e293b" text-anchor="middle">Observe suspected SF produ</text>
  <rect x="350" y="135" width="130" height="70" rx="6" ry="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="415" y="159" font-size="9.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">1. Open SF reporting</text>
  <text x="415" y="173" font-size="9" fill="#1e3a8a" text-anchor="middle">app &amp; check product</text>
  <text x="415" y="187" font-size="9" fill="#1e3a8a" text-anchor="middle">registration (DE1, DE3)</text>
  <polygon points="545,145 570,170 545,195 520,170" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="545" y="139" font-size="9" font-weight="600" fill="#854d0e" text-anchor="middle">Is product in national product</text>
  <rect x="690" y="135" width="130" height="70" rx="6" ry="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="755" y="159" font-size="9.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">2a. Record suspected unregistered</text>
  <text x="755" y="173" font-size="9" fill="#1e3a8a" text-anchor="middle">product details (F2 note)</text>
  <rect x="860" y="135" width="130" height="70" rx="6" ry="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="925" y="159" font-size="9.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">3. Select registered product</text>
  <text x="925" y="173" font-size="9" fill="#1e3a8a" text-anchor="middle">&amp; auto-populate product type</text>
  <text x="925" y="187" font-size="9" fill="#1e3a8a" text-anchor="middle">(SFR.DT.02)</text>
  <rect x="1030" y="135" width="130" height="70" rx="6" ry="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="1095" y="159" font-size="9.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">4. Enter or scan</text>
  <text x="1095" y="173" font-size="9" fill="#1e3a8a" text-anchor="middle">batch number (DE6) &amp;</text>
  <text x="1095" y="187" font-size="9" fill="#1e3a8a" text-anchor="middle">expiry date (DE7)</text>
  <rect x="1200" y="135" width="130" height="70" rx="6" ry="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="1265" y="159" font-size="9.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">5. Select report channel</text>
  <text x="1265" y="173" font-size="9" fill="#1e3a8a" text-anchor="middle">&amp; suspected SF category</text>
  <text x="1265" y="187" font-size="9" fill="#1e3a8a" text-anchor="middle">(DE2, DE8, SFR.DT.01)</text>
  <polygon points="1395,145 1420,170 1395,195 1370,170" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="1395" y="139" font-size="9" font-weight="600" fill="#854d0e" text-anchor="middle">Suspected category?</text>
  <rect x="1540" y="135" width="130" height="70" rx="6" ry="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="1605" y="159" font-size="9.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">6a. Describe suspected quality</text>
  <text x="1605" y="173" font-size="9" fill="#1e3a8a" text-anchor="middle">defect / therapeutic failure</text>
  <text x="1605" y="187" font-size="9" fill="#1e3a8a" text-anchor="middle">&amp; ADR (DE9)</text>
  <rect x="1710" y="135" width="130" height="70" rx="6" ry="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="1775" y="159" font-size="9.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">7a. Attach photos of</text>
  <text x="1775" y="173" font-size="9" fill="#1e3a8a" text-anchor="middle">defective product &amp; packaging</text>
  <rect x="1880" y="135" width="130" height="70" rx="6" ry="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="1945" y="159" font-size="9.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">6b. Describe suspected falsification,</text>
  <text x="1945" y="173" font-size="9" fill="#1e3a8a" text-anchor="middle">counterfeit label or source</text>
  <rect x="2050" y="135" width="130" height="70" rx="6" ry="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="2115" y="159" font-size="9.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">7b. Attach photos of</text>
  <text x="2115" y="173" font-size="9" fill="#1e3a8a" text-anchor="middle">falsified packaging, seal &amp;</text>
  <text x="2115" y="187" font-size="9" fill="#1e3a8a" text-anchor="middle">batch mark</text>
  <polygon points="2245,145 2270,170 2245,195 2220,170" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="2245" y="139" font-size="9" font-weight="600" fill="#854d0e" text-anchor="middle">8. Provide reporter contact de</text>
  <rect x="2390" y="135" width="130" height="70" rx="6" ry="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="2455" y="159" font-size="9.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">8a. Confirm reporter profile,</text>
  <text x="2455" y="173" font-size="9" fill="#1e3a8a" text-anchor="middle">region (SFR.DT.03) &amp; contact</text>
  <text x="2455" y="187" font-size="9" fill="#1e3a8a" text-anchor="middle">(DE10)</text>
  <rect x="2560" y="135" width="130" height="70" rx="6" ry="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="2625" y="159" font-size="9.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">8b. Omit personal contact</text>
  <text x="2625" y="173" font-size="9" fill="#1e3a8a" text-anchor="middle">details (anonymous report)</text>
  <rect x="2730" y="135" width="130" height="70" rx="6" ry="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="2795" y="159" font-size="9.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">9. Submit SF report</text>
  <text x="2795" y="173" font-size="9" fill="#1e3a8a" text-anchor="middle">(online or via offline</text>
  <text x="2795" y="187" font-size="9" fill="#1e3a8a" text-anchor="middle">outbox SF-REP-006)</text>
  <rect x="180" y="315" width="130" height="70" rx="6" ry="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="245" y="339" font-size="9.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">10. Receive SF report,</text>
  <text x="245" y="353" font-size="9" fill="#1e3a8a" text-anchor="middle">assign tracking number &amp;</text>
  <text x="245" y="367" font-size="9" fill="#1e3a8a" text-anchor="middle">log in NMRA registry</text>
  <rect x="350" y="315" width="130" height="70" rx="6" ry="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="415" y="339" font-size="9.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">11. Return confirmation &amp;</text>
  <text x="415" y="353" font-size="9" fill="#1e3a8a" text-anchor="middle">tracking number to reporter</text>
  <text x="415" y="367" font-size="9" fill="#1e3a8a" text-anchor="middle">(SFR.FXNREQ.003-004)</text>
  <rect x="520" y="315" width="130" height="70" rx="6" ry="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="585" y="339" font-size="9.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">12. Screen report, notify</text>
  <text x="585" y="353" font-size="9" fill="#1e3a8a" text-anchor="middle">focal point (SFR.FXNREQ.005) &amp;</text>
  <text x="585" y="367" font-size="9" fill="#1e3a8a" text-anchor="middle">trigger SF-REP-002/003</text>
  <circle cx="708" cy="350" r="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="708" y="382" font-size="9" fill="#1e293b" text-anchor="middle">SF report registered &amp; que</text>
</svg>
